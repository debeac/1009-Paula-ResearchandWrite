<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research &amp; Write</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2024;--muted:#6e5f64;--accent:#b0445e;--accent2:#7d2f43;--soft:#f7eef0;--line:#e6d6da;--bg:#fffdfc;--ok:#2f7a55;--okbg:#e8f4ed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:Fraunces,serif;font-size:36px;line-height:1.1;margin:4px 0 6px}
h2{font-family:Fraunces,serif;font-size:26px;margin:0 0 6px;line-height:1.2}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.lead{color:var(--muted);margin:0 0 4px}
.steps{display:flex;gap:6px;margin:20px 0 26px}
.steps div{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps div.on{background:var(--accent)}
.steplabel{font-size:12px;color:var(--muted);margin-top:-18px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.topic{border:1.5px solid var(--line);border-radius:14px;padding:18px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
.topic:hover{border-color:var(--accent);transform:translateY(-2px)}
.topic.sel{border-color:var(--accent);background:var(--soft)}
.topic .n{font-family:Fraunces,serif;color:var(--accent)}
.topic b{display:block;font-family:Fraunces,serif;font-size:19px;margin:2px 0 4px}
.topic span{color:var(--muted);font-size:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff}
.q{margin-bottom:16px}
.q label{display:block;font-weight:500;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;color:inherit;background:var(--bg);resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13.5px;background:var(--bg);transition:.2s}
.chip.used{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.used::before{content:"✓ "}
.task{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:8px 0 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:24px}
button.btn{font:inherit;font-weight:600;border:none;border-radius:999px;padding:11px 22px;cursor:pointer;background:var(--accent);color:#fff}
button.btn:hover{background:var(--accent2)}
button.btn:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{background:var(--soft)}
.timer{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;padding:6px 8px 6px 16px}
.timer .t{font-family:Fraunces,serif;font-size:22px;min-width:62px;font-variant-numeric:tabular-nums}
.timer.done .t{color:var(--accent)}
.timer button{font:inherit;font-size:13px;border:none;background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.meta .good{color:var(--ok);font-weight:600}
.notes{background:var(--soft);border-radius:10px;padding:14px 18px;margin-top:10px}
.notes p{margin:4px 0}
.notes .empty{color:var(--muted);font-style:italic}
.prompts li{margin:6px 0}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.check .auto{font-size:12px;color:var(--ok);font-weight:600;margin-left:auto;white-space:nowrap}
.check .auto.no{color:var(--accent)}
.stars{display:flex;gap:4px;font-size:28px;cursor:pointer;user-select:none}
.stars span{color:var(--line)}
.stars span.on{color:var(--accent)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:14.5px;min-height:80px}
.compare h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media(max-width:620px){.compare{grid-template-columns:1fr}h1{font-size:30px}}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="kicker">Teacher Débora · Hard Mode</div>
  </div>
  <h1>Research &amp; Write</h1>
  <p class="lead" id="sub">Choose a topic to start.</p>
  <div class="steps" id="steps"></div>
  <div class="steplabel" id="steplabel"></div>
  <main id="app"></main>
</div>

<script>
const TOPICS = [
 {title:"The Four-Day Work Week", hook:"Several countries and companies have tested it. Does it work?",
  q:["Where has it been tested, and what were the results?","What happened to productivity and employee well-being?","Which jobs or industries struggle to adopt it?"],
  talk:["What surprised you the most?","Would it work in your company? Why or why not?","Who would lose with this change?"],
  lang:[["trial / pilot program",/\b(trials?|pilot( program)?s?)\b/i],["according to",/according to/i],["on the other hand",/on the other hand/i],["work-life balance",/work[- ]life balance/i],["it turned out that…",/turned out/i],["I'm not fully convinced",/not (fully|completely|entirely) convinced/i]],
  task:"An <strong>opinion post for LinkedIn</strong>: would you want it at your workplace? Back it up with one fact you found.", min:150, max:200},
 {title:"AI at Work: Helper or Threat?", hook:"AI tools are changing how people do their jobs, including yours.",
  q:["Which tasks in your field are already being done with AI?","What skills do experts say will matter more in the next five years?","Find one company using AI well and one using it badly."],
  talk:["Do you already use AI at work? For what?","Which part of your job could AI never do?","Are you more excited or worried? Why?"],
  lang:[["to streamline",/streamlin/i],["to rely on",/rel(y|ies|ied|ying) on/i],["time-consuming",/time[- ]consuming/i],["it's likely that…",/(likely|unlikely) (that|to)/i],["rather than",/rather than/i],["in the long run",/in the long run/i]],
  task:"An <strong>email to your manager</strong> suggesting one way your team could use AI, with one benefit and one risk.", min:120, max:180},
 {title:"Your Professional Brand", hook:"What people find when they search your name is part of your career.",
  q:["Look at 2 LinkedIn profiles of women you admire in your field. What do their headlines have in common?","What do recruiters say they look for first?","What are common profile mistakes?"],
  talk:["How would you describe your work in one sentence?","What do you want people to remember about you?","What's one achievement you rarely mention?"],
  lang:[["I specialize in",/speciali[sz]e in/i],["background in",/background in/i],["passionate about",/passionate about/i],["track record",/track record/i],["currently",/currently/i],["I help … to …",/\bI help\b/i]],
  task:"Your own <strong>LinkedIn headline + “About” section</strong>, in first person. Real, specific, no clichés.", min:100, max:150},
 {title:"A City to Work From", hook:"If you could relocate for one year for work, where would you go?",
  q:["Choose one city abroad. How does the cost of living compare to Brazil?","Which industries are strong there? Is it easy for foreigners to work?","What would be the biggest cultural challenge for you?"],
  talk:["Why this city and not another one?","What would you miss the most from home?","Would you stay longer than a year?"],
  lang:[["compared to",/compared (to|with)/i],["whereas",/whereas/i],["to be known for",/known for/i],["the main drawback",/drawbacks?/i],["I'd be willing to",/willing to/i],["worth it",/worth it/i]],
  task:"A <strong>short pitch</strong> convincing a friend this city is the right choice, with one comparison and one honest drawback.", min:150, max:200},
 {title:"Burnout & Boundaries", hook:"Being always available has a cost. How do professionals protect their time?",
  q:["How do experts define burnout? What are the early signs?","Which countries have a “right to disconnect” law?","What strategies do successful people use to set boundaries?"],
  talk:["Is it easy for you to say no at work?","What is one boundary you already have?","What would you change tomorrow if you could?"],
  lang:[["to set boundaries",/set(ting)? boundar/i],["to be overwhelmed",/overwhelm/i],["to switch off",/switch(ing)? off/i],["I've realized that…",/reali[sz]ed/i],["instead of",/instead of/i],["from now on",/from now on/i]],
  task:"A <strong>message to a colleague</strong> who keeps sending you work late at night. Be polite, clear and firm.", min:100, max:150},
 {title:"Women Who Changed Your Field", hook:"Every field has women who opened doors. Who are they in yours?",
  q:["Find one woman who made history in your profession or industry.","What obstacles did she face?","What is her legacy today?"],
  talk:["Had you heard of her before?","What do you have in common with her?","What door would you like to open?"],
  lang:[["to pave the way",/pav(e|ed|ing) the way/i],["despite",/despite/i],["groundbreaking",/groundbreaking/i],["to stand out",/st(and|ood)(ing)? out/i],["she went on to…",/went on to/i],["I look up to",/look(ed)? up to/i]],
  task:"A <strong>short profile</strong> of her for a company newsletter, ending with what she means to you.", min:150, max:200}
];
const STEPS=["Choose","Research","Talk","Write","Check","Upgrade","Done"];
const S={step:0,topic:null,notes:[],text:"",rewrite:"",checks:{},stars:0,timers:{}};
let tick=null;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const used=t=>S.topic.lang.filter(l=>l[1].test(t));

function stepsBar(){
 $("#steps").innerHTML=STEPS.map((_,i)=>`<div class="${i<=S.step?'on':''}"></div>`).join("");
 $("#steplabel").textContent=`Step ${S.step+1} of ${STEPS.length} · ${STEPS[S.step]}`;
 $("#sub").innerHTML=S.topic?`<strong>${S.topic.title}</strong> — ${S.topic.hook}`:"Choose a topic to start.";
}
function timer(key,min){
 if(!(key in S.timers))S.timers[key]={left:min*60,run:false};
 return `<div class="timer" id="tm"><span class="t" id="tt"></span><button onclick="toggleT('${key}')" id="tb">Start</button><button onclick="resetT('${key}',${min})">Reset</button></div>`;
}
function paintT(key){
 const t=S.timers[key];if(!t||!$("#tt"))return;
 const m=Math.floor(t.left/60),s=t.left%60;
 $("#tt").textContent=`${m}:${String(s).padStart(2,"0")}`;
 $("#tb").textContent=t.run?"Pause":(t.left===0?"Time!":"Start");
 $("#tm").classList.toggle("done",t.left===0);
}
function toggleT(key){
 const t=S.timers[key];t.run=!t.run&&t.left>0;clearInterval(tick);
 if(t.run)tick=setInterval(()=>{t.left=Math.max(0,t.left-1);if(!t.left){t.run=false;clearInterval(tick)}paintT(key)},1000);
 paintT(key);
}
function resetT(key,min){clearInterval(tick);S.timers[key]={left:min*60,run:false};paintT(key)}
function go(n){clearInterval(tick);Object.values(S.timers).forEach(t=>t.run=false);S.step=n;render();window.scrollTo({top:0,behavior:"smooth"})}
function nav(back,next,label,dis){
 return `<div class="bar">${back!==null?`<button class="btn ghost" onclick="go(${back})">← Back</button>`:"<span></span>"}<button class="btn" id="nx" onclick="go(${next})" ${dis?"disabled":""}>${label} →</button></div>`;
}
function chipsHTML(t){const u=used(t);return S.topic.lang.map(l=>`<span class="chip ${u.includes(l)?'used':''}">${l[0]}</span>`).join("")}

function render(){
 stepsBar();const T=S.topic,a=$("#app");let key=null;
 if(S.step===0){
  a.innerHTML=`<div class="grid">${TOPICS.map((t,i)=>`<button class="topic ${T===t?'sel':''}" onclick="pick(${i})"><span class="n">0${i+1}</span><b>${t.title}</b><span>${t.hook}</span></button>`).join("")}</div>
  ${nav(null,1,"Start research",!T)}`;
 }
 if(S.step===1){key="r";
  a.innerHTML=`<div class="card"><div class="bar" style="margin-top:0"><h2>Research</h2>${timer("r",10)}</div>
  <p class="lead">Find the answers and take notes in English, in your own words. Keywords are enough.</p><h3>Guiding questions</h3>
  ${T.q.map((q,i)=>`<div class="q"><label>${i+1}. ${q}</label><textarea rows="3" oninput="S.notes[${i}]=this.value">${esc(S.notes[i]||"")}</textarea></div>`).join("")}</div>
  ${nav(0,2,"Talk about it")}`;
 }
 if(S.step===2){key="k";
  a.innerHTML=`<div class="card"><div class="bar" style="margin-top:0"><h2>Talk</h2>${timer("k",5)}</div>
  <p class="lead">Tell your teacher what you found, before writing a word.</p>
  <h3>Your notes</h3><div class="notes">${T.q.map((q,i)=>`<p><strong>${i+1}.</strong> ${S.notes[i]?esc(S.notes[i]):'<span class="empty">no notes</span>'}</p>`).join("")}</div>
  <h3>Talk prompts</h3><ul class="prompts">${T.talk.map(p=>`<li>${p}</li>`).join("")}</ul>
  <h3>Try to use</h3><div class="chips">${chipsHTML("")}</div></div>
  ${nav(1,3,"Start writing")}`;
 }
 if(S.step===3){key="w";
  a.innerHTML=`<div class="card"><div class="bar" style="margin-top:0"><h2>Write</h2>${timer("w",15)}</div>
  <p class="task">${T.task} <span style="color:var(--muted)">(${T.min}–${T.max} words)</span></p>
  <h3>Language box · use at least 4</h3><div class="chips" id="ch">${chipsHTML(S.text)}</div>
  <h3>Your text</h3><textarea id="tx" rows="12" placeholder="Start writing here…">${esc(S.text)}</textarea>
  <div class="meta"><span id="wc"></span><span id="uc"></span></div></div>
  ${nav(2,4,"Check it",!S.text.trim())}`;
  const upd=()=>{S.text=$("#tx").value;const w=words(S.text),u=used(S.text).length;
   $("#ch").innerHTML=chipsHTML(S.text);
   $("#wc").innerHTML=`<span class="${w>=T.min&&w<=T.max?'good':''}">${w} words</span> · target ${T.min}–${T.max}`;
   $("#uc").innerHTML=`<span class="${u>=4?'good':''}">${u}/4 language items</span>`;
   $("#nx").disabled=!S.text.trim();};
  $("#tx").addEventListener("input",upd);upd();
 }
 if(S.step===4){
  const w=words(S.text),u=used(S.text).length;
  const items=[["lang","I used at least 4 items from the language box.",u>=4,`${u}/4`],["len",`My text is ${T.min}–${T.max} words.`,w>=T.min&&w<=T.max,`${w} words`],["fact","I included at least one fact from my research, in my own words."],["tone","The tone fits the reader."],["loud","I read it out loud and fixed anything that sounded unnatural."]];
  items.forEach(i=>{if(i.length>2&&!(i[0] in S.checks))S.checks[i[0]]=i[2]});
  a.innerHTML=`<div class="card"><h2>Check</h2><p class="lead">Read it together. Tick what's true.</p>
  <div class="compare" style="grid-template-columns:1fr"><div>${esc(S.text)}</div></div>
  <h3>Checklist</h3><ul class="check">${items.map(i=>`<li><input type="checkbox" ${S.checks[i[0]]?"checked":""} onchange="S.checks['${i[0]}']=this.checked"><span>${i[1]}</span>${i.length>2?`<span class="auto ${i[2]?'':'no'}">${i[3]}</span>`:""}</li>`).join("")}</ul>
  <h3>First draft score</h3><div class="stars" id="st"></div></div>
  ${nav(3,5,"Upgrade one paragraph")}`;
  paintStars();
 }
 if(S.step===5){
  if(!S.rewrite)S.rewrite=S.text;
  a.innerHTML=`<div class="card"><h2>Upgrade</h2><p class="lead">Rewrite with the corrections from class. Pick one paragraph and make it sound more natural.</p>
  <h3>Language box</h3><div class="chips" id="ch">${chipsHTML(S.rewrite)}</div>
  <h3>Final version</h3><textarea id="rw" rows="12">${esc(S.rewrite)}</textarea>
  <div class="meta"><span id="wc"></span><span id="uc"></span></div></div>
  ${nav(4,6,"Finish")}`;
  const upd=()=>{S.rewrite=$("#rw").value;$("#ch").innerHTML=chipsHTML(S.rewrite);
   $("#wc").textContent=`${words(S.rewrite)} words`;$("#uc").textContent=`${used(S.rewrite).length}/4 language items`;};
  $("#rw").addEventListener("input",upd);upd();
 }
 if(S.step===6){
  a.innerHTML=`<div class="card"><h2>Well done.</h2><p class="lead">${T.title} · ${used(S.rewrite).length} language items · ${words(S.rewrite)} words · ${"★".repeat(S.stars)||"no score"}</p>
  <h3>Before → After</h3><div class="compare"><div><h4>First draft</h4>${esc(S.text)}</div><div><h4>Final</h4>${esc(S.rewrite)}</div></div></div>
  <div class="bar"><button class="btn ghost" onclick="go(5)">← Back</button><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="copyAll(this)">Copy texts</button><button class="btn" onclick="restart()">New topic</button></span></div>`;
 }
 if(key)paintT(key);
}
function pick(i){S.topic=TOPICS[i];render()}
function paintStars(){$("#st").innerHTML=[1,2,3,4,5].map(n=>`<span class="${n<=S.stars?'on':''}" onclick="S.stars=${n};paintStars()">★</span>`).join("")}
function copyAll(b){
 const t=`${S.topic.title}\n\nFIRST DRAFT\n${S.text}\n\nFINAL\n${S.rewrite}`;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent="Copied ✓").catch(()=>b.textContent="Copy failed");
}
function restart(){Object.assign(S,{step:0,topic:null,notes:[],text:"",rewrite:"",checks:{},stars:0,timers:{}});render()}
render();
</script>
</body>
</html>
